// Compose compiler stability configuration — Spec 019 research R9.
// Types listed here are treated as stable by the Compose compiler, so composables that
// take them as parameters can skip when the value has not changed.

// Read-only collection interfaces: the app never mutates a list after handing it to UI.
kotlin.collections.*

// java.time value types are immutable.
java.time.*

// Domain models are immutable data classes of stable fields (Clean Architecture,
// Constitution §IV): nothing in presentation mutates them.
com.raumanian.thirtysix.browser.core.domain.model.*
com.raumanian.thirtysix.browser.feature.*.domain.model.*

// java.io.File is an immutable path value; tab-card favicons and screenshots are passed as File.
java.io.File
