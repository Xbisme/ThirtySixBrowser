<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full-height fixture</title>
  <!-- Like map and drawing apps: the page fills the screen through height: 100%, with no content of its own. -->
  <style>html, body { height: 100%; margin: 0; } #app { height: 100%; background: #4a7; }</style>
</head>
<body><div id="app"></div></body>
</html>
