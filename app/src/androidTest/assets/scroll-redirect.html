<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>ready</title>
</head>
<body style="margin:0">
<div style="height:500vh;background:linear-gradient(#fff,#888)"></div>
<script>
  var sent = false;
  function leave() {
    if (sent) return;
    sent = true;
    location = '/redirect?to=tel%3A1';
  }
  document.addEventListener('touchend', leave);
  document.addEventListener('touchcancel', leave);
</script>
</body>
</html>
