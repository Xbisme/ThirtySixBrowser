<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UA fixture</title></head>
<body>
  <!-- Spec 022 G12: shows what the page sees. No viewport tag on purpose, so desktop mode lays it out wide. -->
  <h1>UA fixture</h1>
  <p>userAgent: <span id="ua"></span></p>
  <p>userAgentData.mobile: <span id="mobile"></span></p>
  <p>innerWidth: <span id="width"></span></p>
  <p><a id="again" href="ua.html?again=1">Reload through a link</a></p>
  <script>
    document.getElementById('ua').textContent = navigator.userAgent;
    document.getElementById('mobile').textContent =
      navigator.userAgentData ? String(navigator.userAgentData.mobile) : 'unsupported';
    document.getElementById('width').textContent = String(window.innerWidth);
  </script>
</body>
</html>
