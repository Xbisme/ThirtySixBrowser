<!doctype html>
<html>
<head><meta charset="utf-8"><title>trackers</title></head>
<body>
<h1>tracker fixture</h1>
<p>30 requests to 12 listed tracker hosts (tracker-01.test … tracker-12.test), 10 same-origin
requests, and one image from http://127.0.0.1:PORT (a different site from localhost).</p>
<script>
  const port = new URLSearchParams(location.search).get("port") || location.port;
  const hosts = Array.from({ length: 12 }, (_, i) => `tracker-${String(i + 1).padStart(2, "0")}.test`);
  let n = 0;
  // 30 tracker requests spread over images, scripts, frames and fetch.
  for (let round = 0; round < 3; round++) {
    hosts.forEach((host, i) => {
      if (n >= 30) return;
      const url = `https://${host}/t${round}-${i}`;
      const kind = n % 4;
      if (kind === 0) { const img = new Image(); img.src = url + ".gif"; }
      if (kind === 1) { const s = document.createElement("script"); s.src = url + ".js"; document.head.appendChild(s); }
      if (kind === 2) { const f = document.createElement("iframe"); f.src = url + ".html"; document.body.appendChild(f); }
      if (kind === 3) { fetch(url + ".json").catch(() => {}); }
      n++;
    });
  }
  // 10 first-party requests: the server records them.
  for (let i = 1; i <= 10; i++) fetch(`/ok-${i}.txt`).catch(() => {});
  // A resolvable third-party tracker: reaches the server only when not blocked.
  const pixel = new Image();
  pixel.src = `http://127.0.0.1:${port}/pixel.gif`;
</script>
</body>
</html>
