[versions]
# Build tools
# AGP held on 9.1.x: the Android Studio in use does not support 9.2 yet.
agp = "9.1.1"
kotlin = "2.3.21"

# Static analysis
detekt = "1.23.8"
ktlint = "14.2.0"

# AndroidX core
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"

# Compose BOM (resolves compose.ui + material3 versions)
composeBom = "2026.04.01"

# Hilt 2.59.2 is the first AGP-9 compatible release. KSP versions are decoupled from Kotlin.
hilt = "2.59.2"
ksp = "2.3.7"

# AndroidX Hilt + Lifecycle + Navigation
hiltNavigationCompose = "1.3.0"
# The lifecycle group is not managed by the Compose BOM.
lifecycle = "2.10.0"
navigationCompose = "2.9.8"

# Stable only: Room 3.0 is alpha.
room = "2.8.4"

turbine = "1.2.1"
# Test and lint only.
konsist = "0.18.1"
composeRules = "0.6.8"

# Stable only: the 1.3.0 line is alpha. Ships libdatastore_shared_counter.so (16 KB-aligned).
datastore = "1.2.1"

# Its native code loads only in the JVM test process, so the 16 KB release check does not apply.
# The emulated SDK is pinned in app/src/test/resources/robolectric.properties.
robolectric = "4.16.1"

# Test
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"
coroutinesTest = "1.10.2"

# Core library desugaring: `java.time` on minSdk 24.
desugar = "2.1.5"

# Below API 33, AppCompatDelegate.setApplicationLocales works only on an AppCompatActivity.
appcompat = "1.8.0"

# Stable only: maven-metadata's <release> tag points at an alpha.
webkit = "1.17.0"

coreSplashscreen = "1.2.0"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (BOM-managed — no version pinned individually)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Hilt. With KSP use `hilt-compiler`: the kapt-era `hilt-android-compiler` compiles but generates nothing.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Lifecycle ViewModel Compose (NOT BOM-managed — pin via `lifecycle` key)
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Already transitive; declared because the app calls LifecycleResumeEffect directly.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Navigation Compose
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

app-cash-turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
compose-rules-ktlint = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "composeRules" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }


robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Wired as `coreLibraryDesugaring(...)`, not `implementation`.
android-desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# Espresso artifacts ship as one release train, so they share the espressoCore version.
androidx-espresso-web = { group = "androidx.test.espresso", name = "espresso-web", version.ref = "espressoCore" }
androidx-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
# AGP 9.0+ has built-in Kotlin support — `kotlin-android` plugin is NOT applied
# (https://kotl.in/gradle/agp-built-in-kotlin). Only the Compose-specific plugin
# is still required separately.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

# KSP processor + Hilt Gradle plugin
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
# Compose UI libraries that are always used together
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
