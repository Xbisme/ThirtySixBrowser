name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle launcher; Toolchain auto-provisions JDK 11 for compile)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache deps + build cache + wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Android SDK build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
          key: android-sdk-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-cache-${{ runner.os }}-

      - run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: chmod +x ./gradlew

      - name: Run unit tests (debug)
        run: ./gradlew testDebugUnitTest --build-cache --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Lint partials
        uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates/lint_*
            app/build/intermediates/*lint*
          key: android-lint-${{ runner.os }}-${{ hashFiles('app/src/**/*.kt', 'app/src/**/*.xml', 'app/build.gradle.kts') }}
          restore-keys: |
            android-lint-${{ runner.os }}-

      - run: chmod +x ./gradlew

      - name: Run Android Lint (debug)
        run: ./gradlew lintDebug --build-cache --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore

  static-analysis:
    name: Static analysis (Detekt + ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: chmod +x ./gradlew

      - name: Detekt
        run: ./gradlew detekt --build-cache --stacktrace

      - name: ktlintCheck
        run: ./gradlew ktlintCheck --build-cache --stacktrace

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: |
            app/build/reports/detekt/
            app/build/reports/ktlint/
          if-no-files-found: ignore

  verify-16kb:
    name: Verify 16KB native-lib alignment (fail-soft when no .so)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: chmod +x ./gradlew .specify/scripts/bash/verify-16kb-alignment.sh

      - name: Assemble release (debug-signed fallback per Constitution §XI v1.2.0)
        run: ./gradlew assembleRelease --build-cache --stacktrace

      - name: Verify 16KB alignment (Constitution §IX, FR-016)
        run: .specify/scripts/bash/verify-16kb-alignment.sh app/build/outputs/apk/release/app-release.apk

  instrumented-test:
    name: Instrumented tests (emulator)
    # Re-enabled at Spec 007 (webview-compose-wrapper). Workaround for emulator
    # hang on shutdown lives in the "Force-kill emulator" step below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Spec 015 — the runner image version is part of the AVD cache key on purpose.
      #
      # The cached AVD contains a *quickboot snapshot*, which is only valid for the
      # emulator binary that wrote it. A key with no version component means the
      # stale snapshot keeps being restored forever, so when the runner image
      # upgrades the emulator the result is a zombie boot: the emulator reports
      # `sys.boot_completed=1` while `settings` and `input` are never published, the
      # action's unlock step fails with `adb ... exit code 1`, the Gradle script
      # never runs at all, and the job sits wedged until its 20-minute timeout.
      # Keying on the runner image makes that self-healing.
      #
      # Spec 017 — ⚠️ the previous form of this key, `${{ env.ImageVersion }}`, did
      # NOT work and the bug above kept happening. `ImageVersion` is an environment
      # variable of the *runner image*, not a workflow-level `env:` entry, and the
      # `env` context in an expression only exposes what the workflow, job or step
      # declares. It therefore interpolated to an empty string, which was visible in
      # the cache listing as `avd-api29-Linux-` (trailing dash, no version) — the key
      # was effectively unversioned, exactly what the comment above says to avoid.
      # It was only caught when the emulator job hung on PR #20 and the cache list
      # was inspected by hand.
      #
      # The variable IS available to a shell, so read it there and republish it as a
      # step output, which expressions can see. `runner.os` is dropped from the key:
      # the image version already identifies the OS, and keeping both invites the
      # same false sense of specificity.
      # Fails loudly if the variable ever disappears. A silent fallback such as
      # `${ImageVersion:-unknown}` would pin every run to one constant and quietly
      # recreate the unversioned key this step exists to prevent.
      - name: Resolve runner image version
        id: runner-image
        run: |
          if [ -z "${ImageVersion:-}" ]; then
            echo "::error::ImageVersion is empty — the AVD cache key would be unversioned. See the comment above this step."
            exit 1
          fi
          echo "Runner image: $ImageVersion"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Spec 018 — ⚠️ RESTORE ONLY. The matching save is the LAST step of this job and is
      # gated on the tests having passed.
      #
      # `actions/cache@v4` saves in a post-step that runs even when the job FAILS. That is how
      # this job poisoned itself on 2026-09-15: a run wrote a broken snapshot at 11:53, and
      # every run afterwards restored it and died with `Broken pipe` / `stop: Not implemented`
      # and `Starting 0 tests` — including one on `main` at 4041f608, a docs-only commit. Every
      # run *before* that cache existed had passed. Deleting it by hand fixed the next run
      # immediately.
      #
      # This is a DIFFERENT bug from the one the key fixes (see the comment above): that one is
      # a snapshot from an older runner image being restored forever, and its fix — the version
      # in the key — is still correct and still needed. It cannot help here, because a snapshot
      # written broken at the *current* version matches the key by design.
      #
      # Splitting restore from save means a failed run leaves the cache exactly as it found it.
      - name: AVD cache (restore)
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-${{ steps.runner-image.outputs.version }}

      - name: Create AVD snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - run: chmod +x ./gradlew

      - name: Run instrumented tests
        # Bounded below the job's 20 minutes so a wedged emulator surfaces as a
        # failing step with its own log, rather than a silent cancellation that
        # hides which phase actually stalled.
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        # Spec 008 — emulator-runner@v2's built-in "Terminate Emulator" phase
        # hangs with emulator binary v36+ because QEMU's `stop` command emits
        # "stop: Not implemented" and the action's wait-for-shutdown loop
        # never sees the process exit. The fix that actually works: kill qemu
        # at the END of `script` via `trap EXIT` (fires on both success and
        # failure), so the action's terminate phase finds a dead process and
        # exits immediately. ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL=5 is kept
        # as an additional safety bound.
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "5"
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: must be a SINGLE LINE — emulator-runner@v2 invokes a fresh
          # `/usr/bin/sh -c "<line>"` for each YAML script line, so multi-line
          # variables (STATUS=$?) don't survive between lines.
          #
          # Process kill via `ps aux | awk` with the classic `[q]` / `[c]`
          # bracket trick:
          #   - bypasses pkill's 15-char comm truncation (crashpad_handler is
          #     16 chars, longer than /proc/PID/comm allows)
          #   - bypasses the self-match problem (`pkill -f qemu-system` matched
          #     this very shell's cmdline because the literal string "qemu-system"
          #     is in the script). The bracket trick stores the pattern in the
          #     awk source as `[q]emu-system`, which doesn't contain the literal
          #     substring "qemu-system" → safe.
          script: ./gradlew connectedDebugAndroidTest --build-cache --stacktrace; STATUS=$?; ps aux | awk '/[q]emu-system|[c]rashpad_handler/ { print $2 }' | xargs -r kill -9 2>/dev/null; sleep 2; exit $STATUS

      - name: Force-kill emulator (workaround for hang on shutdown)
        if: always()
        run: |
          adb devices | grep emulator | cut -f1 | while read line; do
            adb -s "$line" emu kill || true
          done
          pkill -9 -f qemu-system || true
          pkill -9 -f crashpad_handler || true
          true

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

      # Spec 018 — the save half of the split above. Deliberately the LAST step, and NOT
      # `if: always()`: it runs only when every preceding step succeeded, which for this job
      # means the instrumented tests actually ran and passed.
      #
      # A snapshot is therefore only ever cached if it demonstrably booted an emulator that
      # ran 109 tests. A run that fails or hangs leaves the existing cache untouched instead
      # of overwriting it with whatever broken state it produced.
      #
      # ⚠️ `success()` is spelled out on purpose. A step with no `if` inherits an implicit
      # success check, but writing ANY custom `if` REPLACES that check rather than adding to
      # it — so `if: steps.avd-cache.outputs.cache-hit != 'true'` alone would run after a
      # failed test run and cache the broken snapshot, which is the exact bug being fixed.
      #
      # The second half skips the upload when the cache was already restored: saving under a
      # key that exists is a no-op, and skipping it keeps the log honest about when a snapshot
      # is genuinely new.
      - name: AVD cache (save, only when the tests passed)
        if: success() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-${{ steps.runner-image.outputs.version }}
