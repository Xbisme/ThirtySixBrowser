# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Performance flags
org.gradle.caching=true
org.gradle.parallel=true

# Auto-provision the JDK 11 toolchain used for the compile target
org.gradle.java.installations.auto-download=true

# Kotlin code style
kotlin.code.style=official

# 16 KB page size: AGP stores native libs uncompressed by default, and the CI step
# (.specify/scripts/bash/verify-16kb-alignment.sh) checks alignment regardless.

# Use non-final R class fields (faster build; default since AGP 4.x)
android.nonTransitiveRClass=true

# Show every deprecation, not just "Deprecated Gradle features were used". Detekt 1.23.8 uses
# ReportingExtension.file(String), which Gradle 10 removes.
org.gradle.warning.mode=all

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
